name: Sync Portfolio Sprint to ICS

on:
  schedule:
    # Every 3 hours. Cron is UTC. Edit this if you want it more/less frequent.
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate portfolio_sprint.ics
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python notion2cal.py

      - name: Commit updated calendar feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add portfolio_sprint.ics
          if ! git diff --cached --quiet; then
            git commit -m "Update Portfolio Sprint calendar feed"
            git push
          else
            echo "No changes to commit."
          fi
